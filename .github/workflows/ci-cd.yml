# GitHub Actions CI/CD workflow for AeestTracker application using Java Spring Boot, Maven and Docker. 
# It runs sequentially through build, test (excluding Selenium tests), and package stages before pushing 
# the resulting Docker image to Docker Hub.
name: AssetTracker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

jobs:
  # Stage 1: Compile the application
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile source code
        run: mvn clean compile

  # Stage 2: Run unit/integration tests (excluding Selenium)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests (excluding Selenium)
        # Excludes any test class with 'Selenium' in its name
        # run: mvn test -Dtest='!*Selenium*'
        run: mvn test -Dtest='!*AssetUiE2ETest*'

  # Stage 3: Package JAR & build/push Docker image
  package:
    name: Package & Docker Push
    runs-on: ubuntu-latest
    needs: test
    # Only build and push Docker images on pushes to main (skip on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR file
        run: mvn package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-app:${{ github.sha }}
