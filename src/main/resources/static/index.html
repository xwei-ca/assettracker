<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Asset Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body>
    <h1>Asset Tracker</h1>

    <section class="panel">
        <h2>Filter</h2>
        <label for="statusFilter">Status:</label>
        <select id="statusFilter">
            <option value="">All</option>
            <option value="IN_USE">In Use</option>
            <option value="AVAILABLE">Available</option>
            <option value="IN_REPAIR">In Repair</option>
            <option value="RETIRED">Retired</option>
        </select>
        <button id="refreshBtn">Refresh</button>
    </section>

    <section class="panel">
        <h2>Add Asset</h2>
        <form id="addForm">
            <input id="name" placeholder="Name" required>
            <input id="type" placeholder="Type" required>
            <input id="status" placeholder="Status" required>
            <input id="serialNumber" placeholder="Serial Number">
            <input id="assignedTo" placeholder="Assigned To">
            <button type="submit">Add</button>
        </form>
        <p id="message" class="message"></p>
    </section>

    <section class="panel">
        <h2>Assets</h2>
        <table id="assetTable">
            <thead>
                <tr>
                    <th>ID</th><th>Name</th><th>Type</th>
                    <th>Status</th><th>Serial</th><th>Assigned To</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
