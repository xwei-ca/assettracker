spring.application.name=assettracker

# Error handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# H2 in-memory database for development
spring.datasource.url=jdbc:h2:mem:assettracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Nicer SQL logging format
spring.jpa.properties.hibernate.use_sql_comments=true
# Only show SQL from your own packages (less noise from Hibernate internals)
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# H2 web console (optional, handy for inspecting data)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Makes Jackson write dates as ISO strings globally
#spring.jackson.serialization.write-dates-as-timestamps=false